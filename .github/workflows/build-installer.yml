name: Installer

# Reusable workflow, called by MSBuildDLL after its DLL job succeeds. It reuses
# that run's ReleaseDLL artifact (nothing is rebuilt) and uploads only
# ExplorerEx-Setup.exe.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-2022
    env:
      BUILD_DIR: ${{ github.workspace }}\build\bin\ReleaseDLL\x64
    steps:
    - uses: actions/checkout@v4
    - name: Set short git commit SHA
      shell: bash
      run: echo "COMMIT_SHORT_SHA=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV
    - name: Download DLL build
      uses: actions/download-artifact@v4
      with:
        name: ExplorerEx-${{ env.COMMIT_SHORT_SHA }}
        path: ${{ env.BUILD_DIR }}
    - name: Install NSIS
      run: |
        choco install nsis -y --no-progress
        echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh
    - name: Assemble NSIS installer
      run: >
        makensis
        /DBUILDDIR=${{ env.BUILD_DIR }}
        /DSRCDIR=${{ github.workspace }}\src\Shell\Loader
        /DOUTDIR=${{ env.BUILD_DIR }}
        ${{ github.workspace }}\src\Shell\Loader\ExplorerEx-Setup.nsi
    - name: Upload installer
      uses: actions/upload-artifact@v4.4.0
      with:
        name: ExplorerEx-Setup-${{ env.COMMIT_SHORT_SHA }}
        path: ${{ env.BUILD_DIR }}\ExplorerEx-Setup.exe
        if-no-files-found: error
