# separate terms of service, privacy policy, and support
# documentation.

name: MSBuildDLL

on:
  push:
    branches: [ "ExplorerEx-2k" ]
  pull_request:
    branches: [ "ExplorerEx-2k" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: ReleaseDLL

permissions:
  contents: read

jobs:
  build-releasedll:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    - uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: amd64
    - uses: NuGet/setup-nuget@v2
      with:
        nuget-version: '6.12.1'
    - name: Restore pinned native loader dependency
      run: nuget restore src\Shell\Loader\packages.config -PackagesDirectory packages -Source https://api.nuget.org/v3/index.json -NonInteractive
    - name: Compile ExplorerEx DLLs and standalone loader
      run: | 
        msbuild explorer.sln /p:Configuration=ReleaseDLL /p:Platform=x64
    - name: Install NSIS
      run: |
        choco install nsis -y --no-progress
        echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh
    - name: Assemble NSIS installer
      run: >
        makensis
        /DBUILDDIR=${{ github.workspace }}\build\bin\ReleaseDLL\x64
        /DSRCDIR=${{ github.workspace }}\src\Shell\Loader
        /DOUTDIR=${{ github.workspace }}\build\bin\ReleaseDLL\x64
        ${{ github.workspace }}\src\Shell\Loader\ExplorerEx-Setup.nsi
    - name: Set short git commit SHA
      id: vars
      shell: bash
      run: |
        calculatedSha=$(git rev-parse --short ${{ github.sha }})
        echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV
    - name: Upload dll
      uses: actions/upload-artifact@v4.4.0
      with:
        name: ExplorerEx-${{ env.COMMIT_SHORT_SHA }}
        path: |
          .\build\bin\ReleaseDLL\x64\
